version: "2"
linters:
  default: none
  enable:
    - goheader
    - revive
    - unused
    - staticcheck
    - typecheck
    - govet
  settings:
    goheader:
      values:
        regexp:
          copyright-year: 20[0-9][0-9]
      template-path: code-header-template.txt
    revive:
      enable-all-rules: true
      rules:
      - name: dot-imports
        disabled: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new-from-rev: 83f3e89d49b7882e0b9afc305a00f67232ba96b1
