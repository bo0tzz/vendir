version: "2"
linters:
  default: none
  enable:
    - goheader
    - revive
    - unused
    - staticcheck
    - govet
  settings:
    goheader:
      values:
        regexp:
          copyright-year: 20[0-9][0-9]
      template-path: code-header-template.txt
    revive:
      enable-all-rules: true
      rules:
      - name: dot-imports
        disabled: true
      - name: add-constant
        arguments:
          - allowInts: "0,1"
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new-from-rev: 83f3e89d49b7882e0b9afc305a00f67232ba96b1
  exclude-rules:
    # 1. Ignore function line count rules in test files
    - path: _test\.go
      linters:
        - revive
      text: "function-lines:" # Excludes the function length check from Revive

    # 2. Ignore overall line length limits in test files
    - path: _test\.go
      linters:
        - revive
      text: "line-length-limit:"
    - linters:
      - staticcheck
      text: "ST1005:"
